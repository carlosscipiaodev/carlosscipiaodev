<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Carlos Vinicius — NEXUS System Boot</title>
<desc id="desc">Painel futurista de inicialização em azul ciano, com grid, radar e barra de carregamento animada.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050A14"/><stop offset=".55" stop-color="#080F20"/><stop offset="1" stop-color="#030A11"/></linearGradient>
  <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#00B9D8"/><stop offset=".6" stop-color="#54F4F0"/><stop offset="1" stop-color="#2E78FF"/></linearGradient>
  <linearGradient id="scanner" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#00E5FF" stop-opacity="0"/><stop offset=".45" stop-color="#00E5FF" stop-opacity="0"/><stop offset=".5" stop-color="#00E5FF" stop-opacity=".12"/><stop offset=".53" stop-color="#00E5FF" stop-opacity="0"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#10354C" stroke-width=".7"/></pattern>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="frame"><rect x="17" y="16" width="1166" height="328" rx="15"/></clipPath>
</defs>
<style>
  .mono{font-family:Consolas,Monaco,'Courier New',monospace}
  .scan{animation:scan 8s linear infinite}
  .orbit{transform-origin:936px 173px;animation:orbit 18s linear infinite}
  .orbit2{transform-origin:936px 173px;animation:orbit-reverse 28s linear infinite}
  .pulse{animation:pulse 2.3s ease-in-out infinite}
  .bootfill{transform-box:fill-box;transform-origin:left center;animation:load 3.5s cubic-bezier(.12,.64,.24,1) both}
  .boot01{animation:fade 1.5s ease-in-out .3s both}
  .boot02{animation:fade 1.5s ease-in-out 1s both}
  .boot03{animation:fade 1.5s ease-in-out 1.7s both}
  .blinker{animation:blink 1.2s step-end infinite}
  @keyframes scan{0%{transform:translateY(-360px)}100%{transform:translateY(360px)}}
  @keyframes orbit{to{transform:rotate(360deg)}}
  @keyframes orbit-reverse{to{transform:rotate(-360deg)}}
  @keyframes pulse{0%,100%{opacity:.38}50%{opacity:1}}
  @keyframes fade{0%{opacity:0}100%{opacity:1}}
  @keyframes load{0%{transform:scaleX(.035)}100%{transform:scaleX(1)}}
  @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:.15}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="360" rx="20" fill="url(#bg)"/>
<g clip-path="url(#frame)">
  <rect x="17" y="16" width="1166" height="328" fill="url(#grid)" opacity=".6"/>
  <path d="M0 73H1200M0 296H1200" stroke="#123047" opacity=".55"/>
  <rect class="scan" x="17" y="16" width="1166" height="328" fill="url(#scanner)"/>
  <path d="M28 63V30H62M1138 30H1170V62M28 298V330H62M1138 330H1170V298" stroke="#16D9EA" stroke-width="2" fill="none" opacity=".87"/>
  <rect x="44" y="42" width="9" height="9" fill="#00DFFF" class="pulse"/>
  <text x="65" y="51" fill="#76DCE6" font-size="12.5" letter-spacing="2.7" class="mono">NEXUS / PERSONAL INTERFACE</text>
  <text x="626" y="51" fill="#57849B" font-size="10.5" letter-spacing="1.3" class="mono">PROTO 03 // FORTALEZA, BR</text>
  <path d="M44 73H706" stroke="#20526A" stroke-width="1"/>
  <text x="50" y="128" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="52" letter-spacing="8" fill="#F1FCFF">CARLOS</text>
  <text x="46" y="191" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="61" letter-spacing="5" fill="url(#cyan)">VINICIUS</text>
  <path d="M51 210H532" stroke="url(#cyan)" stroke-width="2"/>
  <text x="50" y="235" fill="#A7D3E4" font-size="13.5" letter-spacing="2" class="mono">COMPUTER SCIENCE  /  DEVELOPER</text>
  <text x="51" y="267" fill="#6F9BB0" font-size="10" letter-spacing="1.6" class="mono boot01">[ OK ]  CORE MODULES INITIALIZED</text>
  <text x="51" y="287" fill="#6F9BB0" font-size="10" letter-spacing="1.6" class="mono boot02">[ OK ]  DEVELOPMENT ENVIRONMENT READY</text>
  <text x="51" y="307" fill="#4DE7DE" font-size="10" letter-spacing="1.6" class="mono boot03">[ OK ]  SYSTEM ONLINE <tspan class="blinker">_</tspan></text>
  <rect x="452" y="298" width="220" height="4" rx="2" fill="#143B4D"/>
  <rect x="452" y="298" width="220" height="4" rx="2" fill="url(#cyan)" class="bootfill" filter="url(#glow)"/>
  <text x="623" y="288" font-size="9.5" fill="#8AABBB" class="mono">100%</text>
  <g transform="translate(936 173)">
    <circle r="130" fill="#00D7EC" opacity=".025"/>
    <circle r="124" fill="none" stroke="#1D6075" stroke-width="1" stroke-dasharray="2 11"/>
    <circle r="112" fill="none" stroke="#1D5B70" stroke-width="1"/>
    <circle r="96" fill="none" stroke="#1FB9C8" stroke-opacity=".48" stroke-width="1" stroke-dasharray="18 13 2 18"/>
    <circle r="75" fill="none" stroke="#1E647E" stroke-width="1"/>
    <circle r="54" fill="none" stroke="#1D485A" stroke-width="1.5"/>
    <circle r="6" fill="#00E5FF" class="pulse" filter="url(#glow)"/>
    <path d="M-147 0H147M0-147V147" stroke="#16485A" stroke-width=".8" stroke-dasharray="3 8"/>
    <path d="M-133-12V12M133-12V12M-12-133H12M-12 133H12" stroke="#00DCF0" stroke-width="1.5"/>
  </g>
  <g class="orbit"><circle cx="936" cy="173" r="116" fill="none" stroke="#35EAF6" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="145 584" filter="url(#glow)"/><circle cx="936" cy="173" r="116" fill="none" stroke="#4B78F0" stroke-width="3" stroke-dasharray="34 695" stroke-dashoffset="-300"/></g>
  <g class="orbit2"><circle cx="936" cy="173" r="86" fill="none" stroke="#40D0E4" stroke-width="2" stroke-dasharray="72 468"/></g>
  <text x="936" y="157" fill="#E8FBFF" font-size="17" font-family="Consolas,Monaco,monospace" font-weight="700" letter-spacing="2" text-anchor="middle">C.V.</text>
  <text x="936" y="196" fill="#73C7D3" font-size="10" font-family="Consolas,Monaco,monospace" letter-spacing="1.5" text-anchor="middle">ONLINE</text>
  <path d="M766 92H817L836 105M1048 242L1065 259H1144" stroke="#1C6D86" stroke-width="1" fill="none"/>
  <circle cx="766" cy="92" r="2" fill="#00E5FF"/><circle cx="1144" cy="259" r="2" fill="#00E5FF"/>
  <text x="767" y="82" fill="#77A7BA" font-size="10" class="mono" letter-spacing="1">NEURAL LINK</text>
  <text x="1076" y="277" fill="#77A7BA" font-size="10" class="mono" letter-spacing="1">ACTIVE</text>
  <text x="771" y="326" fill="#486E82" font-size="10" class="mono" letter-spacing="1.1">DESIGN • DEVELOP • EVOLVE</text>
</g>
<rect x="17" y="16" width="1166" height="328" rx="15" fill="none" stroke="#134357" stroke-width="1.5"/>
</svg>
